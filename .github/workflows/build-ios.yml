name: iOS Release IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    env:
      BUILD_TYPE: Release

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Apps built with the iOS 27 SDK must adopt the UIScene lifecycle or UIKit traps at launch
      # (EXC_BREAKPOINT in __UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption), which Flycast doesn't do yet.
      # Prefer Xcode 16.x, then 26.x, never fall back to an unknown default, and refuse an SDK >= 27.
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$X" ]; then X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1); fi
          if [ -n "$X" ]; then sudo xcode-select -switch "$X"; fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $SDK"
          if [ "${SDK%%.*}" -ge 27 ]; then
            echo "::error::iPhoneOS SDK $SDK requires the UIScene lifecycle; the app would fail to launch. Install/select an Xcode with an older SDK."
            exit 1
          fi

      # ldid is required: the CMake IPA step signs the binary with entitlements.
      - name: Install build tools
        run: |
          brew update || true
          brew install ldid cmake

      - name: Build OpenMP.xcframework
        run: ./shell/apple/emulator-ios/OpenMP/build_ios_openmp.sh --disableSimulator

      - name: Fetch MoltenVK (iOS static library)
        id: moltenvk
        run: |
          set -e
          MVK_TAG=v1.4.2
          mkdir -p mvk && cd mvk
          for asset in MoltenVK-ios.tar MoltenVK-all.tar; do
            if curl -fL -o "$asset" "https://github.com/KhronosGroup/MoltenVK/releases/download/${MVK_TAG}/${asset}"; then
              tar xf "$asset"; break
            fi
          done
          find . -name "*.xcframework" -maxdepth 6
          LIB=$(find "$PWD" -path "*ios-arm64/*" -name "libMoltenVK.a" | head -n 1)
          echo "Using: $LIB"
          test -n "$LIB"
          echo "lib=$LIB" >> "$GITHUB_OUTPUT"

      # Fresh build dir on purpose: the repo's committed build/ folder is a
      # generated Xcode project with absolute /Users/... paths.
      - name: Configure
        run: |
          cmake -B build-ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_XCODE_ATTRIBUTE_GCC_OPTIMIZATION_LEVEL=3 \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DMOLTENVK_IOS_LIB=${{ steps.moltenvk.outputs.lib }}

      - name: Build Release (also produces Flycast.ipa)
        run: |
          cmake --build build-ios --config $BUILD_TYPE 2>&1 | tee build.log | tail -n 150
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Locate IPA
        run: |
          IPA=$(find build-ios -name "Flycast.ipa" | head -n 1)
          if [ -z "$IPA" ]; then echo "Flycast.ipa not found"; find build-ios -name "*.app" -o -name "*.ipa"; exit 1; fi
          mkdir -p artifact
          cp "$IPA" artifact/Flycast-Release.ipa
          ls -lh artifact

      - uses: actions/upload-artifact@v4
        with:
          name: Flycast-iOS-Release
          path: artifact/Flycast-Release.ipa
